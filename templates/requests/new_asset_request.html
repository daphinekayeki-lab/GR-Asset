{% extends 'base.html' %}
{% block title %}New Asset Request — GR AMS{% endblock %}
{% block page_title %}Request an Asset{% endblock %}
{% block content %}
<div class="page-title">
  <div class="page-title-text"><p>Submit a request for ICT review and asset assignment.</p></div>
  <a href="{{ url_for('requests.request_status') }}" class="btn btn-outline">← Request Status</a>
</div>

<form method="POST" style="max-width:700px">
  <div class="card">
    <div class="card-header"><h2>Request Details</h2></div>
    <div style="padding:24px">
      <div class="form-grid form-grid-2">

        <div class="form-group" style="grid-column:1/-1">
          <label>Item Requested *</label>
          <input name="item_requested" placeholder="e.g. Projector, Laptop, Camera" required>
        </div>

        <div class="form-group">
          <label>Asset Category *</label>
          <select name="category_id" required>
            <option value="">Select category</option>
            {% for c in categories %}
            <option value="{{ c.id }}">{{ c.name }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label>Country *</label>
          <select name="project_id" required>
            <option value="">Select country</option>
            {% for p in countries %}
            <option value="{{ p.id }}" {% if current_user.project_id == p.id %}selected{% endif %}>{{ p.name }} ({{ p.code }})</option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label>Department *</label>
          <input name="department" value="{{ current_user.department or '' }}" placeholder="e.g. Programs" required>
        </div>

        <div class="form-group">
          <label>Priority *</label>
          <select name="priority" required>
            {% for val, label in priorities %}
            <option value="{{ val }}" {% if val == 'medium' %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label>Date Needed From *</label>
          <input name="date_needed_from" id="date-from" type="date" min="{{ now.date().isoformat() }}" onchange="calcDuration()" required>
        </div>

        <div class="form-group">
          <label>Date Needed To *</label>
          <input name="date_needed_to" id="date-to" type="date" min="{{ now.date().isoformat() }}" onchange="calcDuration()" required>
        </div>

        <div class="form-group">
          <label>Duration</label>
          <input id="dur-display" placeholder="Auto-calculated" readonly style="background:var(--surface2);color:var(--text-muted)">
        </div>

        <div class="form-group" style="grid-column:1/-1">
          <label>Reason for Request *</label>
          <textarea name="purpose" placeholder="Explain why you need this asset and how it will be used." required style="min-height:100px"></textarea>
        </div>

      </div>
    </div>
    <div style="padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px">
      <button type="submit" class="btn btn-primary">Submit Request</button>
    </div>
  </div>
</form>

<script>
function calcDuration() {
  var from = document.getElementById('date-from').value;
  var to = document.getElementById('date-to').value;
  var disp = document.getElementById('dur-display');
  if (from && to) {
    var d1 = new Date(from), d2 = new Date(to);
    if (d2 >= d1) {
      var days = Math.round((d2 - d1) / 86400000) + 1;
      disp.value = days + ' day' + (days !== 1 ? 's' : '');
    } else {
      disp.value = 'End date must be after start date';
    }
  }
}
</script>
{% endblock %}
