{% extends 'base.html' %}
{% block title %}Request Repair — GR AMS{% endblock %}
{% block page_title %}Request Repair{% endblock %}
{% block content %}
<div class="page-title">
  <div class="page-title-text"><p>Submit a repair request for an assigned asset.</p></div>
  <a href="{{ url_for('requests.repair_requests') }}" class="btn btn-outline">← My Repairs</a>
</div>
<form method="POST" enctype="multipart/form-data" style="max-width:700px">
  <div class="card">
    <div class="card-header"><h2>Repair Request Form</h2></div>
    <div style="padding:24px">
      <div class="form-grid form-grid-2">
        <div class="form-group" style="grid-column:1/-1">
          <label>Asset *</label>
          <select name="asset_id" required>
            {% for a in assets %}<option value="{{ a.id }}">{{ a.tag }} — {{ a.name }}</option>{% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>Problem Category *</label>
          <select name="problem_category" required>
            {% for val, label in categories %}<option value="{{ val }}">{{ label }}</option>{% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>Priority *</label>
          <select name="priority" required>
            {% for val, label in priorities %}<option value="{{ val }}" {% if val == 'medium' %}selected{% endif %}>{{ label }}</option>{% endfor %}
          </select>
        </div>
        <div class="form-group" style="grid-column:1/-1">
          <label>Description of the Issue *</label>
          <textarea name="description" required placeholder="Describe the problem in detail…" style="min-height:100px"></textarea>
        </div>
        <div class="form-group" style="grid-column:1/-1">
          <label>Attach Photo (optional)</label>
          <input type="file" name="photo" accept="image/*">
        </div>
      </div>
    </div>
    <div style="padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px">
      <button type="submit" class="btn btn-primary">Submit Repair Request</button>
    </div>
  </div>
</form>
{% endblock %}
